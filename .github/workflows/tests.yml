name: Tests

on:
  push:
    branches: [master, next_version]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All stable Python versions that uv can provide
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Create environment and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv -r requirements-dev.txt -e .

      - name: Run tests
        # test_cli.py needs real Sonos speakers on the local network
        run: .venv/bin/python -m pytest tests --ignore=tests/test_cli.py -v
